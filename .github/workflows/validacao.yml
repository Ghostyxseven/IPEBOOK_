name: Validação
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build:web
        env:
          CI: '1'
