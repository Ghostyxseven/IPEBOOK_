<!-- @dsCard height=300 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Capa</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--surface); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface); }
  .cv svg { position: absolute; left: 480px; top: 0; }
  .b-forest { fill: var(--cover-forest); } .b-navy { fill: var(--cover-navy); } .b-brown { fill: var(--cover-brown); }
  .b-wine { fill: var(--cover-wine); } .b-ochre { fill: var(--cover-ochre); } .b-primary { fill: var(--primary); }
  .b-tint { fill: var(--secondary-container); } .sun { fill: var(--brand-amber); }
  .shelf { fill: var(--brand-brown); }
  .sp { rx: var(--radius-xs); ry: var(--radius-xs); }
  .txt { position: absolute; left: 48px; bottom: 44px; max-width: 420px; }
  .name { margin: 0; font: 700 96px/0.95 var(--font-serif); color: var(--brand-brown); letter-spacing: -0.01em; }
  .tag { margin: 12px 0 0; font: 400 14px/20px var(--font-sans); color: var(--on-surface-variant); }
</style></head>
<body>
<div class="cv">
  <!--
    blocks: cover-forest, cover-navy, cover-brown, cover-wine, cover-ochre e primary como lombadas de 48 a 72 px (múltiplos de space-12) e 168 a 236 px de altura; secondary-container como fundo tonal; brand-brown como a prateleira.
    arrangement: uma estante — lombadas em pé, coladas, com uma inclinada, apoiadas numa prateleira que sangra pela direita.
    pattern: motivo literal do produto (livros na estante, o ícone da aba Estante) mais o sol das capas ilustrativas em brand-amber.
    scales: larguras space-12 e space-16, folga space-1, cantos radius-xs, sol com raio space-8.
  -->
  <svg width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
    <rect class="b-tint" x="24" y="0" width="456" height="252"/>
    <circle class="sun" cx="404" cy="84" r="32"/>
    <rect class="b-forest sp" x="56" y="84" width="64" height="168"/>
    <rect class="b-navy sp" x="124" y="52" width="48" height="200"/>
    <rect class="b-ochre sp" x="176" y="100" width="72" height="152"/>
    <rect class="b-wine sp" x="252" y="36" width="56" height="216"/>
    <rect class="b-primary sp" x="312" y="116" width="48" height="136"/>
    <rect class="b-brown sp" x="372" y="128" width="56" height="124" transform="rotate(12 428 252)"/>
    <rect class="shelf" x="24" y="252" width="456" height="12"/>
  </svg>
  <div class="txt">
    <p class="name">IpêBook</p>
    <p class="tag">Livros que circulam no seu bairro: venda, troca e doação.</p>
  </div>
</div>
</body>
</html>
